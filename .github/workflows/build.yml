name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "If set, also create a GitHub Release with this tag (e.g. v0.2.0)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fetch Gradle wrapper JAR if missing
        run: |
          mkdir -p gradle/wrapper
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew

      - name: Grant execute on gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
            echo "HAS_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "HAS_RELEASE_SIGNING=false" >> "$GITHUB_ENV"
          fi

      - name: Build release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease :iconpack:assembleRelease

      - name: Name APKs
        id: apk
        run: |
          mkdir -p dist
          LAB=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          PACK=$(find iconpack/build/outputs/apk -name "*.apk" | head -n 1)
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "$TAG_NAME" == v* ]]; then
            VER="${TAG_NAME#v}"
          else
            MAJOR=$(sed -n 's/.*versionMajor = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
            MINOR=$(sed -n 's/.*versionMinor = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
            PATCH=$(sed -n 's/.*versionPatch = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
            VER="${MAJOR}.${MINOR}.${PATCH}"
          fi
          LAB_NAME="Nothing-Icon-Lab-v${VER}.apk"
          PACK_NAME="Nothing-OneUI-Icons-v${VER}.apk"
          cp "$LAB" "dist/$LAB_NAME"
          cp "$PACK" "dist/$PACK_NAME"
          echo "apk_path=dist/$LAB_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=$LAB_NAME" >> "$GITHUB_OUTPUT"
          echo "pack_path=dist/$PACK_NAME" >> "$GITHUB_OUTPUT"
          echo "pack_name=$PACK_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [ "${HAS_RELEASE_SIGNING}" = "true" ]; then
            echo "signing=release" >> "$GITHUB_OUTPUT"
          else
            echo "signing=debug-fallback" >> "$GITHUB_OUTPUT"
          fi
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nothing-apks-v${{ steps.apk.outputs.version }}
          path: dist/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: Nothing Icon Lab ${{ github.event.inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/Nothing-Icon-Lab-v${{ steps.apk.outputs.version }}.apk
            dist/Nothing-OneUI-Icons-v${{ steps.apk.outputs.version }}.apk
          body: |
            ## Nothing Icon Lab ${{ github.event.inputs.release_tag || github.ref_name }}

            See CHANGELOG.md.

            **Lab APK:** `${{ steps.apk.outputs.apk_name }}`
            **Icon Pack APK:** `${{ steps.apk.outputs.pack_name }}`
            **Signing:** `${{ steps.apk.outputs.signing }}`

            Theme Park: Good Lock → Theme Park → Icons → Create New → Icon Pack → Third Party → Nothing OneUI Icons.

            After updating the Icon Pack APK, create a new Theme Park icon theme so it re-reads resources.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
