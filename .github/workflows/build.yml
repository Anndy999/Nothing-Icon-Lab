name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "If set, also create a GitHub Release with this tag (e.g. v0.1.1)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fetch Gradle wrapper JAR if missing
        run: |
          mkdir -p gradle/wrapper
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew

      - name: Grant execute on gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Decode release keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
          echo "HAS_RELEASE_SIGNING=true" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name APK
        id: apk
        run: |
          mkdir -p dist
          SRC=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "$TAG_NAME" == v* ]]; then
            VER="${TAG_NAME#v}"
          else
            VER=$(python3 - <<'PY'
          import re
          text = open("app/build.gradle.kts", encoding="utf-8").read()
          major = int(re.search(r"versionMajor\s*=\s*(\d+)", text).group(1))
          minor = int(re.search(r"versionMinor\s*=\s*(\d+)", text).group(1))
          patch = int(re.search(r"versionPatch\s*=\s*(\d+)", text).group(1))
          print(f"{major}.{minor}.{patch}")
          PY
          )
          fi
          NAME="Nothing-Icon-Lab-v${VER}.apk"
          cp "$SRC" "dist/$NAME"
          echo "apk_path=dist/$NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [ "${HAS_RELEASE_SIGNING}" = "true" ]; then
            echo "signing=release" >> "$GITHUB_OUTPUT"
          else
            echo "signing=debug-fallback" >> "$GITHUB_OUTPUT"
          fi
          ls -lh "dist/$NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_path }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: Nothing Icon Lab ${{ github.event.inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.apk_path }}
          body: |
            ## Nothing Icon Lab ${{ github.event.inputs.release_tag || github.ref_name }}

            See CHANGELOG.md for Added / Changed / Fixed / Known Issues.

            **APK:** `${{ steps.apk.outputs.apk_name }}`
            **Signing:** `${{ steps.apk.outputs.signing }}`

            If signing is `debug-fallback`, GitHub Secrets for the release keystore are not configured yet. This APK is **not** a stable release signature.

            Required secrets for stable signing:
            - `ANDROID_KEYSTORE_BASE64`
            - `ANDROID_KEYSTORE_PASSWORD`
            - `ANDROID_KEY_ALIAS`
            - `ANDROID_KEY_PASSWORD`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
